[package]
name = "memtest"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Small memory and cache bandwidth and latency benchmark"
license = "MIT"
readme = "README.md"
publish = false

[features]
default = ["gui"]
gui = ["dep:slint", "dep:winresource", "dep:png", "dep:rfd"]

[dependencies]
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "raw-window-handle-06", "unstable-winit-030"] }
png = { version = "=0.18.1", optional = true }
rfd = { version = "=0.17.2", optional = true, default-features = false, features = ["xdg-portal", "wayland"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.34", optional = true, default-features = false }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

# Keep the benchmark crate optimized for speed; shrink the GUI dependencies.
[profile.release.package."*"]
opt-level = "s"
