name: Cache counter discovery

on:
  push:
    branches: [slc-discovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build standalone counter probe
        run: |
          mkdir -p out
          xcrun clang -std=c11 -O2 -Wall -Wextra -Werror -fblocks \
            -framework CoreFoundation -framework IOKit \
            experiments/slc-counters.c -o out/mac-cache-probe
          codesign --force --sign - out/mac-cache-probe
      - name: Record host and probe available counters
        run: |
          sw_vers > out/host.txt
          for key in machdep.cpu.brand_string hw.model hw.memsize hw.ncpu hw.pagesize hw.cachelinesize hw.l1dcachesize hw.l2cachesize hw.l3cachesize kern.hv_vmm_present; do
            sysctl "$key" >> out/host.txt 2>/dev/null || true
          done
          ./out/mac-cache-probe out/channels > out/counters.txt 2> out/counters.stderr.txt
          cat out/counters.txt
      - name: Compare root visibility inside the guest
        run: |
          sudo -n ./out/mac-cache-probe out/root-channels > out/counters-root.txt 2> out/counters-root.stderr.txt
          sudo -n chown -R "$(id -u):$(id -g)" out/root-channels
          cat out/counters-root.txt
      - name: Inspect memory-controller symbol names
        if: always()
        run: |
          image=/System/Library/KernelCollections/BootKernelExtensions.kc
          if [ -r "$image" ]; then
            strings -a "$image" | LC_ALL=C awk 'tolower($0) ~ /slc|memcachecontroller|applemcc/ && length($0) < 240 { if (++n <= 200) print }' > out/controller-symbols.txt
          else
            printf '%s\n' 'Kernel collection is not available on this runner.' > out/controller-symbols.txt
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cache-counter-probe-${{ matrix.runner }}
          path: out/
          if-no-files-found: error
          retention-days: 14
